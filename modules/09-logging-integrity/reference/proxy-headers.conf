# Enabling XFF: the directives that forward the real client to the backend.
#
# The owasp/modsecurity-crs nginx image runs as a reverse proxy by default
# (PROXY=true, upstream = BACKEND) and applies equivalents of these. They are
# shown here so the "enable XFF" step is explicit, not an invisible default.
#
# If these are absent, the backend's socket peer is the WAF, so every log line
# records the WAF's IP and you cannot see the real attacker.
#
#   src_ip without forwarding  = 172.30.0.x   (the WAF)
#   src_ip with forwarding     = the real client
#
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;                 # direct client as nginx saw it
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;   # appends this hop to the chain
proxy_set_header X-Forwarded-Proto $scheme;
