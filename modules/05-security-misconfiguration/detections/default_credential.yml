title: Default credential in use (security misconfiguration)
id: 6a2f9c84-1d57-4e3b-b0a9-8c41e7d2f5b3
status: experimental
description: >
  The app emitted an OCSF Detection Finding (class_uid 2004) because a seeded
  default account authenticated. Default accounts and passwords left enabled are
  a security misconfiguration; their use in production is a strong signal. The
  WAF cannot know which accounts are defaults; the app can.
references:
  - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
author: LogSting
logsource:
  product: logsting
  service: security
detection:
  selection:
    class_uid: 2004
    message|contains: 'default credential'
  condition: selection
falsepositives:
  - A deliberately retained break-glass account; exclude it explicitly
level: high
tags:
  - attack.initial_access
  - attack.t1078.001
